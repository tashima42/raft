syntax = "proto3";

option go_package = "github.com/tashima42/raft/proto";

package proto;

service KeyVal {
  rpc Set (SetRequest) returns (SetResponse) {}
  rpc Get (GetRequest) returns (GetResponse) {}
}

message SetRequest {
  string key = 1;
  string value = 2;
}

message SetResponse {
  string key = 1;
  string value = 2;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string key = 1;
  string value = 2;
}
